/* ---- 每门课稳定哈希，用于几何变化 ---- */
function hseed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}

/* ---- 几何文案换行 ---- */
function wrapText(text,maxChars){
  const words=text.split(' ');const lines=[];let cur='';
  for(let w of words){while(w.length>maxChars){if(cur){lines.push(cur.trim());cur='';}lines.push(w.slice(0,maxChars));w=w.slice(maxChars);}
    const cand=(cur?cur+' '+w:w);if(cand.length>maxChars){if(cur.trim())lines.push(cur.trim());cur=w;}else{cur=cand;}}
  if(cur.trim())lines.push(cur.trim());return lines.length?lines:['']; }
function tspans(lines,x,y0,lh){return lines.map((ln,i)=>'<tspan x="'+x+'" y="'+(y0+i*lh)+'">'+esc(ln)+'</tspan>').join('');}

function geoCinema(c){const p=pal(c),gid='g'+hseed(c.id||c.nameZh);const zh=tspans(wrapText(c.nameZh,10).slice(0,2),200,492,28);let holes='';for(let i=0;i<8;i++){holes+='<rect x="'+(26+i*48)+'" y="28" width="26" height="20" rx="3" fill="rgba(0,0,0,0.55)"/><rect x="'+(26+i*48)+'" y="512" width="26" height="20" rx="3" fill="rgba(0,0,0,0.55)"/>';}const defs='<defs><linearGradient id="'+gid+'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p.dark+'"/><stop offset="1" stop-color="'+p.base+'"/></linearGradient><linearGradient id="'+gid+'m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,220,150,0.5)"/><stop offset="1" stop-color="rgba(255,220,150,0)"/></linearGradient></defs>';const inner='<rect width="400" height="560" fill="url(#'+gid+'b)"/><path d="M200 90 L90 300 L310 300 Z" fill="url(#'+gid+'m)"/><rect x="14" y="20" width="372" height="8" fill="'+p.deep+'"/><rect x="14" y="532" width="372" height="8" fill="'+p.deep+'"/>'+holes+'<rect x="150" y="128" width="100" height="34" rx="6" fill="'+p.light+'"/><text x="200" y="152" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="15" font-weight="900" fill="'+p.deep+'">NOW SHOWING</text>'+dayBadge(c)+'<text x="200" y="400" text-anchor="middle" font-family="Georgia,\'PingFang SC\',serif" font-size="24" font-weight="700" fill="'+p.accent+'" letter-spacing="1">'+esc(c.nameEn)+'</text><text x="200" y="492" text-anchor="middle" font-family="\'PingFang SC\',serif" font-size="20" font-weight="700" fill="'+p.light+'">'+zh+'</text><text x="200" y="524" text-anchor="middle" font-family="\'PingFang SC\',serif" font-size="13" fill="rgba(245,231,200,0.85)">'+esc(c.teacherZh)+'</text>';return shell(c,defs,inner);}

const BUILDERS={blueprint:geoBlueprint,bauhaus:geoBauhaus,ink:geoInk,sport:geoSport,deco:geoDeco,emblem:geoEmblem,music:geoMusic,cinema:geoCinema};

function posterSVG(c){const g=geoOf(c);return (BUILDERS[g]||geoBauhaus)(c);}

function render(){
  const groups={};ORDER.forEach(k=>groups[k]=[]);
  COURSES.forEach(c=>groups[c.cat].push(c));
  const app=document.getElementById('app');let html='';
  ORDER.forEach(k=>{
    if(!groups[k].length)return;
    html+='<section class="shelf"><div class="shelf-head"><span class="badge" style="background:'+CAT_COLOR[k].base+'">'+CAT_ICON[k]+'</span><h2>'+k+'</h2><span class="count">'+groups[k].length+' 门课程</span></div><div class="books">';
    groups[k].forEach(c=>{
      html+='<button class="book" data-id="'+esc(c.nameZh)+'"><span class="book-cover">'+posterSVG(c)+'</span><span class="book-teacher">'+esc(c.teacherZh)+'</span></button>';
    });
    html+='</div></section>';
  });
  app.innerHTML=html;
  document.querySelectorAll('.book').forEach(b=>b.onclick=()=>openModal(b.getAttribute('data-id')));
}
function openModal(name){
  const c=COURSES.find(x=>x.nameZh===name);if(!c)return;
  const g=gradOf(c);
  const hl=(c.highlightsZh||[]).map(h=>'<span>'+esc(h)+'</span>').join('');
  document.getElementById('modal').innerHTML=
    '<button class="modal-close" onclick="document.getElementById(\'modalBg\').classList.remove(\'show\')">✕</button>'+
    '<div class="modal-top" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><div class="inner">'+
    '<span style="font-size:40px">'+esc(c.icon)+'</span><h2 style="margin-top:10px">'+esc(c.nameZh)+'</h2><div class="en">'+esc(c.nameEn)+'</div>'+
    '<div class="meta"><span>'+esc(c.categoryZh)+'</span><span>'+esc(c.audience)+'</span><span>'+esc(c.capacity)+'</span><span>'+esc(c.language)+'</span><span>'+esc(c.time)+'</span></div></div></div>'+
    '<div class="modal-body"><div class="desc">'+esc(c.descZh)+'</div><div class="hl">'+hl+'</div><div class="info"><b>授课教师</b>：'+esc(c.teacherZh)+'</div></div>';
  document.getElementById('modalBg').classList.add('show');
}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')document.getElementById('modalBg').classList.remove('show');};
render();
</script>
