const CAT_COLOR={"科学与技术": "#2563eb", "艺术与设计": "#d946ef", "语言与文学": "#b45309", "体育与健康": "#16a34a", "商业与领导": "#f59e0b"};
const DAY_CN={"monday": "周一", "tuesday": "周二", "wednesday": "周三"};
;

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function classify(c){const kw=c.nameZh+c.categoryZh;
 if(/经济|商业|投资|模拟|沙盘|领导|服务|金融/.test(kw))return"商业与领导";
 if(/科学|计算机|化学|生物|物理|数学|天文|3D|AI|编程|科技|实验|AMC|NEC|EconX|竞赛|创新|工程/.test(kw))return"科学与技术";
 if(/艺术|音乐|电影|戏剧|数字媒体|歌曲|作品|乐高|设计|绘画|摄影|歌单|乐队|演唱|舞蹈/.test(kw))return"艺术与设计";
 if(/语言|英语|语文|中文|韩语|日语|诗歌|甲骨文|侦探|阅读|写作|文学|识字|经典|诵读|辩论|历史|文化/.test(kw))return"语言与文学";
 return"体育与健康";}
function render(){
 const groups={}; ORDER.forEach(k=>groups[k]=[]);
 COURSES.forEach(c=>groups[classify(c)].push(c));
 const app=document.getElementById('app');
 let html='';
 ORDER.forEach(k=>{
   if(!groups[k].length)return;
   html+='<section class="shelf"><div class="shelf-head"><span class="badge" style="background:'+CAT_COLOR[k]+'">'+CAT_ICON[k]+'</span><h2>'+k+'</h2><span class="count">'+groups[k].length+' 门课程</span></div><div class="books">';
   groups[k].forEach(c=>{
     const g=c.grad&&c.grad.length?c.grad:['#5A3580','#2e1a44'];
     html+='<button class="book" data-id="'+esc(c.nameZh)+'"><span class="book-cover" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')">'+
       '<span class="cover-bg" style="background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.35),transparent 42%),radial-gradient(circle at 12% 90%,rgba(0,0,0,.2),transparent 45%)"></span>'+
       '<span class="cover-icon">'+esc(c.icon)+'</span>'+
       '<span class="cover-day">'+(DAY_CN[c.day]||'')+'</span>'+
       '<span class="cover-name"><h3>'+esc(c.nameZh)+'</h3><div class="en">'+esc(c.nameEn)+'</div><span class="cat">'+esc(c.categoryZh)+'</span></span></span>'+
       '<span class="book-teacher">'+esc(c.teacherZh)+'</span></button>';
   });
   html+='</div></section>';
 });
 app.innerHTML=html;
 document.querySelectorAll('.book').forEach(b=>b.onclick=()=>openModal(b.dataset.id));
}
function openModal(name){
 const c=COURSES.find(x=>x.nameZh===name); if(!c)return;
 const g=c.grad&&c.grad.length?c.grad:['#5A3580','#2e1a44'];
 const hl=(c.highlightsZh||[]).map(h=>'<span>'+esc(h)+'</span>').join('');
 document.getElementById('modal').innerHTML=
  '<button class="modal-close" onclick="document.getElementById("modalBg").classList.remove("show")">✕</button>'+
  '<div class="modal-top" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><span class="bg"></span><div class="inner">'+
   '<span style="font-size:40px">'+esc(c.icon)+'</span>'+
   '<h2 style="margin-top:10px">'+esc(c.nameZh)+'</h2><div class="en">'+esc(c.nameEn)+'</div>'+
   '<div class="meta"><span>'+esc(c.categoryZh)+'</span><span>'+esc(c.audience)+'</span><span>'+esc(c.capacity)+'</span><span>'+esc(c.language)+'</span><span>'+esc(c.time)+'</span></div></div></div>'+
  '<div class="modal-bodybody"><div class="desc">'+esc(c.descZh)+'</div><div class="hl">'+hl+'</div><div class="info"><b>授课教师</b>：'+esc(c.teacherZh)+'</div></div>';
 document.getElementById('modalBg').classList.add('show');
}
document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')document.getElementById('modalBg').classList.remove('show');}
