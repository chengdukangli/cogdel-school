/* ============================================================
   Cogdel Chengdu · ECA Fair 2026 — Styles
   Theme: warm bookstore / library shelf
   ============================================================ */

:root {
  --bg: #f6efe4;
  --bg-2: #efe4d0;
  --ink: #3b2f24;
  --ink-soft: #6b5a47;
  --paper: #fffdf8;
  --wood: #a9743f;
  --wood-dark: #8a5a2e;
  --wood-light: #c6905a;
  --gold: #c9972f;
  --gold-light: #e7c66a;
  --shadow: 0 10px 30px rgba(70, 45, 20, .18);
  --shadow-sm: 0 4px 14px rgba(70, 45, 20, .14);
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -100px, rgba(231,198,106,.25), transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 1280px; margin: 0 auto; padding: 0 18px 140px; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(246,239,228,.82);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(120,85,40,.14);
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1280px; margin: 0 auto; padding: 12px 18px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  font-size: 30px; line-height: 1;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.15));
}
.brand-title { font-weight: 800; font-size: 17px; letter-spacing: .2px; }
.brand-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.lang-btn {
  border: 1px solid var(--wood); color: var(--wood-dark);
  background: var(--paper); padding: 8px 14px; border-radius: 999px;
  font-weight: 700; font-size: 13px; cursor: pointer;
  transition: all .2s;
}
.lang-btn:hover { background: var(--wood); color: #fff; }

/* mode toggle (student / parent) */
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.mode-toggle {
  display: flex; background: #f0e6d4; border-radius: 999px; padding: 3px;
  border: 1px solid rgba(120,85,40,.18);
}
.mode-btn {
  border: none; background: transparent; padding: 7px 14px; border-radius: 999px;
  font-weight: 800; font-size: 13px; cursor: pointer; color: var(--ink-soft);
  font-family: var(--font); transition: all .2s; white-space: nowrap;
}
.mode-btn.active { background: var(--wood); color: #fff; box-shadow: var(--shadow-sm); }

/* parent browse banner */
.parent-banner {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  margin: 18px auto 0; max-width: 720px;
  background: #fff3d6; border: 1px solid var(--gold-light); border-radius: 14px;
  padding: 12px 18px; font-size: 14px; font-weight: 700; color: #7a5a1e;
}
.parent-banner-icon { font-size: 20px; }
.parent-hint { font-size: 13.5px; color: #7a5a1e; line-height: 1.6; }

body.parent-mode .app { padding-bottom: 60px; }
body.parent-mode .hero-sub { max-width: 620px; }

/* ---------- Hero ---------- */
.hero { padding: 34px 0 10px; text-align: center; }
.hero-title {
  margin: 0; font-size: clamp(30px, 5.4vw, 52px); font-weight: 900;
  line-height: 1.05; letter-spacing: .5px;
  background: linear-gradient(120deg, #8a5a2e 0%, #c9972f 45%, #b45309 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-title-zh { display: block; }
.hero-title-en {
  display: block; font-size: .55em; letter-spacing: 3px; margin-top: 6px;
  text-transform: uppercase;
  background: linear-gradient(120deg, #6b5a47, #9a7b52);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-sub { margin: 16px auto 0; max-width: 560px; font-size: 15px; color: var(--ink-soft); }
.hero-sub .hl { color: #b45309; font-weight: 800; }

/* ---------- Pillars ---------- */
.pillars {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  margin-top: 22px;
}
.pillar {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--paper); border: 1px solid rgba(120,85,40,.18);
  box-shadow: var(--shadow-sm); font-weight: 700; font-size: 13.5px;
}
.pillar .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ---------- Identity ---------- */
.identity {
  margin: 22px 0 4px; display: flex; justify-content: center;
}
.identity-inner {
  width: min(760px, 100%);
  background: var(--paper); border: 1px solid rgba(120,85,40,.18);
  border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow-sm);
}
.identity-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
.identity-icon { font-size: 20px; }
.identity-fields { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; }
.identity-fields input, .identity-fields select {
  border: 1.5px solid rgba(120,85,40,.22); border-radius: 12px;
  padding: 11px 14px; font-size: 15px; font-family: var(--font);
  background: #fffdf8; color: var(--ink); outline: none; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
.identity-fields input:focus, .identity-fields select:focus {
  border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,151,47,.18);
}
.identity-fields input::placeholder { color: #b8a78d; }
.identity-fields select { appearance: auto; cursor: pointer; }
.identity-fields select:invalid { color: #b8a78d; }
.identity-hint { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 10px; }

/* ---------- Shelves ---------- */
.shelves { margin-top: 30px; }

.shelf { position: relative; margin-bottom: 46px; }

.shelf-header {
  display: flex; align-items: center; gap: 14px; margin: 0 6px 16px;
}
.shelf-badge {
  width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center;
  color: #fff; font-weight: 900; font-size: 18px; box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.shelf-badge small { display: block; font-size: 9px; font-weight: 700; letter-spacing: 1px; opacity: .9; }
.shelf-title { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .3px; }
.shelf-title-en {
  display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft);
  letter-spacing: 3px; text-transform: uppercase; margin-top: 2px;
}
.shelf-count { margin-left: auto; font-size: 13px; color: var(--ink-soft); font-weight: 700; }

/* The wooden shelf itself */
.shelf-books {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 22px 18px;
  padding: 34px 18px 24px;
  border-radius: 18px;
  position: relative;
  background:
    linear-gradient(180deg, rgba(120,70,30,.10), rgba(120,70,30,.04) 70%),
    var(--paper);
  border: 1px solid rgba(120,85,40,.14);
  box-shadow: var(--shadow-sm);
}
.shelf-books::after { /* shelf board */
  content: "";
  position: absolute; left: -6px; right: -6px; bottom: -16px; height: 18px;
  background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  border-radius: 8px;
  box-shadow: 0 6px 14px rgba(70,40,12,.4);
}
.shelf-books::before { /* subtle inner glow */
  content: "";
  position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
  background: radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.5), transparent 60%);
}

/* ---------- Book / poster card ---------- */
.book {
  position: relative; cursor: pointer; border: none; background: none; padding: 0;
  text-align: left; font: inherit; color: inherit;
  -webkit-appearance: none; appearance: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .25s cubic-bezier(.2,.8,.3,1.2);
  transform-origin: bottom center;
}
.book:hover { transform: translateY(-14px) rotate(-1deg) scale(1.03); z-index: 5; }
.book:active { transform: translateY(-4px) scale(.99); }

.book-cover {
  width: 100%; aspect-ratio: 5 / 7; border-radius: 10px 12px 12px 10px;
  box-shadow: 0 10px 22px rgba(40,22,6,.28), inset 0 0 0 1px rgba(255,255,255,.14);
  overflow: hidden; position: relative; display: block;
  transition: box-shadow .25s;
}
.book:hover .book-cover { box-shadow: 0 20px 40px rgba(40,22,6,.38), inset 0 0 0 1px rgba(255,255,255,.16); }

/* book spine (left edge) */
.book-cover::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,.06));
  border-radius: 6px 0 0 6px; z-index: 3;
}

.book-name {
  margin-top: 10px; font-weight: 800; font-size: 14px; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.book-teacher { margin-top: 3px; font-size: 12px; color: var(--ink-soft); }

/* ---------- Cart (selection bar) ---------- */
.cart {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 14px; z-index: 50;
  width: min(880px, calc(100vw - 24px));
  background: rgba(255,253,248,.96); backdrop-filter: blur(10px);
  border: 1px solid rgba(120,85,40,.22); border-radius: 20px;
  box-shadow: 0 14px 44px rgba(60,35,12,.32);
  padding: 14px 16px 16px;
}
.cart-head {
  display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px;
}
.cart-icon { font-size: 20px; }
.cart-count { margin-left: auto; font-weight: 800; color: var(--wood-dark); font-size: 13px; }
.cart-slots { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.cart-slot {
  flex: 1 1 120px; min-width: 120px; border-radius: 12px; padding: 9px 10px;
  border: 2px dashed rgba(120,85,40,.28); background: #faf4e9;
  display: flex; flex-direction: column; gap: 3px;
}
.cart-slot .slot-day { font-size: 11px; font-weight: 800; color: var(--wood-dark); }
.cart-slot.filled { border-style: solid; border-color: var(--gold); background: #fff7e3; }
.cart-slot .slot-name { font-size: 13px; font-weight: 800; line-height: 1.2; }
.cart-slot .slot-remove { align-self: flex-start; font-size: 11px; color: #b45309; cursor: pointer; margin-top: 2px; }
.cart-slot .slot-empty { font-size: 12px; color: #b8a78d; }
.cart-submit {
  width: 100%; margin-top: 12px; padding: 13px; border: none; cursor: pointer;
  border-radius: 13px; font-size: 16px; font-weight: 900; letter-spacing: 1px;
  color: #fff; background: linear-gradient(120deg, var(--gold), #b45309);
  box-shadow: var(--shadow-sm); transition: all .2s;
}
.cart-submit:disabled { background: #d8cbb6; color: #9a8a72; cursor: not-allowed; box-shadow: none; }
.cart-submit:not(:disabled):hover { filter: brightness(1.06); transform: translateY(-1px); }
.cart-msg { margin-top: 8px; font-size: 12.5px; text-align: center; min-height: 16px; color: var(--ink-soft); }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(40,24,8,.55); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 18px;
  animation: fade .2s ease;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  position: relative; width: min(880px, 100%); max-height: 92vh; overflow: auto;
  background: var(--paper); border-radius: 22px; box-shadow: 0 30px 80px rgba(30,16,4,.5);
  animation: pop .25s cubic-bezier(.2,.9,.3,1.2);
}
.modal-close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(0,0,0,.55); color: #fff; font-size: 16px;
}
.modal-close:hover { background: rgba(0,0,0,.75); }

.modal-body { display: grid; grid-template-columns: 300px 1fr; }
@media (max-width: 640px) { .modal-body { grid-template-columns: 1fr; } }

.modal-poster {
  background: linear-gradient(160deg, #3b2f24, #5b4632);
  display: flex; align-items: center; justify-content: center; padding: 34px 26px;
  border-radius: 22px 0 0 22px;
}
.modal-poster .poster { width: 220px; }
@media (max-width: 640px) {
  .modal-poster { border-radius: 22px 22px 0 0; padding: 22px; }
  .modal-poster .poster { width: 170px; }
}

.modal-info { padding: 30px 30px 26px; }
.modal-cat {
  display: inline-flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.tag {
  font-size: 12px; font-weight: 800; padding: 4px 11px; border-radius: 999px;
  background: #f3e9d6; color: var(--wood-dark);
}
.tag.pillar { color: #fff; }
.modal-title { margin: 0 0 4px; font-size: 26px; font-weight: 900; line-height: 1.2; }
.modal-title-en { margin: 0 0 14px; font-size: 15px; color: var(--ink-soft); font-weight: 700; letter-spacing: .5px; }
.modal-teacher { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.modal-teacher .t-label { color: var(--ink-soft); font-weight: 600; margin-right: 6px; }

.modal-desc { font-size: 15px; line-height: 1.75; color: #4b3c2b; margin: 0 0 18px; }

.modal-meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 18px;
  font-size: 13.5px;
}
.meta-item { display: flex; gap: 8px; }
.meta-item b { color: var(--wood-dark); white-space: nowrap; }
.meta-item span { color: #4b3c2b; }

.modal-hl-title { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--wood-dark); margin: 0 0 8px; }
.modal-hl { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.modal-hl .chip {
  background: #f3e9d6; border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700;
}
.modal-note {
  background: #fff3d6; border-left: 4px solid var(--gold); padding: 10px 14px;
  border-radius: 8px; font-size: 13px; color: #7a5a1e; margin-bottom: 20px;
}

.modal-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  border: none; cursor: pointer; border-radius: 12px; padding: 13px 22px;
  font-size: 15px; font-weight: 900; letter-spacing: .5px; font-family: var(--font);
  transition: all .2s;
}
.btn-primary { background: linear-gradient(120deg, var(--gold), #b45309); color: #fff; box-shadow: var(--shadow-sm); }
.btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn-primary.selected { background: #16a34a; }
.btn-ghost { background: #f3e9d6; color: var(--ink); }
.btn-ghost:hover { background: #eadfca; }

/* ---------- Poster (SVG-generated) ---------- */
.poster svg { display: block; width: 100%; height: auto; border-radius: 10px 12px 12px 10px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 120;
  background: #3b2f24; color: #fff; padding: 12px 22px; border-radius: 999px;
  font-weight: 800; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  animation: pop .25s cubic-bezier(.2,.9,.3,1.4);
}
.toast[hidden] { display: none; }

/* ---------- Confetti ---------- */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }

/* ---------- Animations ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .app { padding: 0 12px 150px; }
  .shelf-books { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 18px 12px; padding: 28px 12px 20px; }
  .brand-sub { display: none; }
  .identity-inner { border-radius: 18px; width: 100%; }
  .identity-fields { grid-template-columns: 1fr; }
  .topbar-inner { flex-wrap: wrap; gap: 8px; }
  .topbar-actions { width: 100%; justify-content: flex-end; }
  .mode-btn { padding: 6px 11px; font-size: 12px; }
}

</style>
</head>
<body>
  <div class="app" id="app">

    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">🎓</span>
          <div class="brand-text">
            <div class="brand-title">Cogdel Chengdu · ECA Fair 2026</div>
            <div class="brand-sub" data-i18n="brandSub">成都康礼学校 · 中学部课外课程选课平台</div>
          </div>
        </div>
        <div class="topbar-actions">
          <div class="mode-toggle" id="modeToggle" role="tablist" aria-label="浏览模式">
            <button class="mode-btn" data-mode="student" role="tab" data-i18n="modeStudent">学生选课</button>
            <button class="mode-btn" data-mode="parent" role="tab" data-i18n="modeParent">家长浏览</button>
          </div>
          <button class="lang-btn" id="langToggle" title="切换语言 / Switch language">中文 / EN</button>
        </div>
      </div>
    </header>

    <!-- ===== Hero ===== -->
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">
          <span class="hero-title-zh">你的选择，至关重要</span>
          <span class="hero-title-en">Your Choice Matters</span>
        </h1>
        <p class="hero-sub" data-i18n="heroSub">
          在<span class="hl">周一 / 周二 / 周三</span>各选一门你心仪的 ECA，开启这学期的精彩旅程。
        </p>
        <div class="pillars" id="pillars"></div>
      </div>
    </section>

    <!-- ===== Parent browse banner ===== -->
    <section class="parent-banner" id="parentBanner" hidden>
      <span class="parent-banner-icon">👨‍👩‍👧</span>
      <span data-i18n="parentBanner">家长浏览模式 · 您可查看全部课程简介；如需选课，请让孩子在「学生选课」入口操作。</span>
    </section>

    <!-- ===== Student identity ===== -->
    <section class="identity" id="identity">
      <div class="identity-inner">
        <div class="identity-head">
          <span class="identity-icon">🧑‍🎓</span>
          <span data-i18n="whoAreYou">请填写你的选课信息</span>
        </div>
        <div class="identity-fields">
          <input id="nameZh" type="text" maxlength="20" placeholder="中文名 Chinese name" autocomplete="name" />
          <input id="nameEn" type="text" maxlength="40" placeholder="英文名 English name" autocomplete="given-name" />
          <select id="grade" aria-label="年级 Grade">
            <option value="" selected data-i18n="gradePlaceholder">年级 Grade</option>
            <option value="P7">P7</option>
            <option value="P8">P8</option>
            <option value="P9">P9</option>
            <option value="IG">IG (IGCSE)</option>
            <option value="AS">AS</option>
            <option value="A2">A2</option>
          </select>
        </div>
        <span class="identity-hint" data-i18n="identityHint">选完课后，我们会以此信息登记</span>
      </div>
    </section>

    <!-- ===== Shelves ===== -->
    <main class="shelves" id="shelves"></main>

    <!-- ===== Selection bar ===== -->
    <aside class="cart" id="cart" aria-live="polite">
      <div class="cart-head">
        <span class="cart-icon">🛒</span>
        <span data-i18n="mySelection">我的选课</span>
        <span class="cart-count" id="cartCount">0 / 3</span>
      </div>
      <div class="cart-slots" id="cartSlots"></div>
      <button class="cart-submit" id="cartSubmit" disabled data-i18n="submit">提交选课</button>
      <div class="cart-msg" id="cartMsg"></div>
    </aside>

    <!-- ===== Detail modal ===== -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast" hidden></div>

    <!-- ===== Confetti canvas ===== -->
    <canvas id="confetti" class="confetti"></canvas>
  </div>

  <script>
/* ============================================================
   Cogdel Chengdu ECA Fair · Fall 2026 — Course Data
   Source: "ECA Scheduling Fall 2026-2027 Final.xlsx" + course PPT
   ============================================================ */

    for (let i = 0; i < 7; i++) stripes += `<path d="M${-40 + i * 70} 560 L${140 + i * 70} 0" stroke="rgba(255,255,255,0.10)" stroke-width="${26 + i * 6}"/>`;
    const defs = `<defs><linearGradient id="${gid}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9261f"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>`;
    const inner = `
      <rect width="400" height="560" fill="url(#${gid}b)"/>
      ${stripes}
      <circle cx="200" cy="210" r="86" fill="none" stroke="#fff" stroke-width="14" stroke-dasharray="180 360" stroke-linecap="round"/>
      <circle cx="200" cy="210" r="34" fill="#fff"/>
      <path d="M70 300 q 260 -60 300 30" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="52" y="60" font-family="'Arial Black',sans-serif" font-size="13" font-weight="900" fill="#fff" opacity="0.9">${esc(c.categoryEn.toUpperCase())}</text>
      ${dayBadge(c)}
      <text x="200" y="404" text-anchor="middle" font-family="'Arial Black','PingFang SC',sans-serif" font-size="24" font-weight="900" fill="#fff" font-style="italic" letter-spacing="0.5">${en}</text>
      <text x="200" y="502" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="20" font-weight="900" fill="#fff">${zh}</text>
      <text x="200" y="530" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.95)">${esc(c.teacherEn)}</text>
      <text x="200" y="549" text-anchor="middle" font-size="9" letter-spacing="3" fill="rgba(255,255,255,0.75)">COGDEL · ECA FAIR 2026</text>`;
    return svgShell(c, defs, inner);
  }

  /* --- Style: Cinema --- */
  function styleCinema(c) {
    const gid = "ci" + c.id;
    const en = tspans(wrapText(c.nameEn.toUpperCase(), 18).slice(0, 3), 200, 400, 32);
    const zh = tspans(wrapText(c.nameZh, 10).slice(0, 2), 200, 496, 28);
    let holes = "";
    for (let i = 0; i < 8; i++) holes += `<rect x="${26 + i * 48}" y="28" width="26" height="20" rx="3" fill="rgba(0,0,0,0.55)"/><rect x="${26 + i * 48}" y="512" width="26" height="20" rx="3" fill="rgba(0,0,0,0.55)"/>`;
    const defs = `<defs>
      <linearGradient id="${gid}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12131a"/><stop offset="1" stop-color="#241d20"/></linearGradient>
      <linearGradient id="${gid}beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,220,150,0.5)"/><stop offset="1" stop-color="rgba(255,220,150,0)"/></linearGradient>
    </defs>`;
    const inner = `
      <rect width="400" height="560" fill="url(#${gid}b)"/>
      <path d="M200 90 L90 300 L310 300 Z" fill="url(#${gid}beam)"/>
      <rect x="14" y="20" width="372" height="8" fill="#1b1b22"/>
      <rect x="14" y="532" width="372" height="8" fill="#1b1b22"/>
      ${holes}
      <rect x="150" y="128" width="100" height="34" rx="6" fill="#e8b339"/>
      <text x="200" y="152" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="15" font-weight="900" fill="#1b1b22">NOW SHOWING</text>
      <text x="200" y="300" text-anchor="middle" font-size="44" fill="#fff">🎬</text>
      ${dayBadge(c)}
      <text x="200" y="400" text-anchor="middle" font-family="Georgia,'Times New Roman','PingFang SC',serif" font-size="23" font-weight="700" fill="#f5e7c8" letter-spacing="1">${en}</text>
      <text x="200" y="496" text-anchor="middle" font-family="'PingFang SC',serif" font-size="20" font-weight="700" fill="#e8b339">${zh}</text>
      <text x="200" y="524" text-anchor="middle" font-family="'PingFang SC',serif" font-size="13" fill="rgba(245,231,200,0.85)">${esc(c.teacherEn)}</text>
      <text x="200" y="547" text-anchor="middle" font-size="9" letter-spacing="3" fill="rgba(232,179,57,0.7)">COGDEL · ECA FAIR 2026</text>`;
    return svgShell(c, defs, inner);
  }

  /* --- Style: Emblem (leadership / service) --- */
  function styleEmblem(c) {
    const gid = "em" + c.id;
    const en = tspans(wrapText(c.nameEn.toUpperCase(), 17).slice(0, 3), 200, 412, 32);
    const zh = tspans(wrapText(c.nameZh, 10).slice(0, 2), 200, 506, 28);
    const defs = `<defs><linearGradient id="${gid}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12263f"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>`;
    const inner = `
      <rect width="400" height="560" fill="url(#${gid}b)"/>
      <circle cx="200" cy="200" r="118" fill="none" stroke="rgba(212,175,55,0.35)" stroke-width="2"/>
      <circle cx="200" cy="200" r="104" fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M200 96 l-14 22 h28 Z" fill="#d4af37"/>
      <path d="M96 200 c 0 -60 48 -108 108 -108 c 60 0 108 48 108 108" fill="none" stroke="#d4af37" stroke-width="2"/>
      <path d="M96 200 c 0 60 48 108 108 108 c 60 0 108 -48 108 -108" fill="none" stroke="#d4af37" stroke-width="2"/>
      <circle cx="200" cy="200" r="40" fill="none" stroke="#d4af37" stroke-width="2"/>
      <text x="200" y="214" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700" fill="#e7d9a8">${esc(mono(c))}</text>
      <text x="200" y="366" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" letter-spacing="4" fill="#d4af37">${esc(c.categoryEn.toUpperCase())}</text>
      ${dayBadge(c)}
      <text x="200" y="412" text-anchor="middle" font-family="Georgia,'Times New Roman','PingFang SC',serif" font-size="23" font-weight="700" fill="#f5ecd7" letter-spacing="1">${en}</text>
      <text x="200" y="506" text-anchor="middle" font-family="'PingFang SC',serif" font-size="20" font-weight="700" fill="#d4af37">${zh}</text>
      <text x="200" y="534" text-anchor="middle" font-family="'PingFang SC',serif" font-size="13" fill="rgba(245,236,215,0.85)">${esc(c.teacherEn)}</text>
      <text x="200" y="549" text-anchor="middle" font-size="9" letter-spacing="3" fill="rgba(212,175,55,0.7)">COGDEL · ECA FAIR 2026</text>`;
    return svgShell(c, defs, inner);
  }

  function posterSVG(c) {
    const builders = {
      blueprint: styleBlueprint, deco: styleDeco, bauhaus: styleBauhaus, ink: styleInk,
      music: styleMusic, sport: styleSport, cinema: styleCinema, emblem: styleEmblem
    };
    return (builders[styleOf(c)] || styleBauhaus)(c);
  }

  /* ---------------- render pillars ---------------- */
  function renderPillars() {
    const el = $("#pillars");
    const defs = [
      { key: "academic", color: "#2563eb", label: t("pillarAcademic") },
      { key: "creative", color: "#d946ef", label: t("pillarCreative") },
      { key: "athletics", color: "#16a34a", label: t("pillarAthletics") },
      { key: "leadership", color: "#f59e0b", label: t("pillarLeadership") }
    ];
    el.innerHTML = defs.map((d) =>
      `<span class="pillar"><span class="dot" style="background:${d.color}"></span>${esc(d.label)}</span>`
    ).join("");
  }

  /* ---------------- render shelves ---------------- */
  function renderShelves() {
    const root = $("#shelves");
    root.innerHTML = "";
    DAY_ORDER.forEach((day) => {
      const list = COURSES.filter((c) => c.day === day);
      const shelf = document.createElement("section");
      shelf.className = "shelf";
      const dayInfo = DAYS[day];
      const dayC = dayColor(day);
      const title = lzh(dayInfo.en, dayInfo.zh);

      const books = document.createElement("div");
      books.className = "shelf-books";
      list.forEach((c) => books.appendChild(bookCard(c)));

      shelf.innerHTML = `
        <div class="shelf-header">
          <div class="shelf-badge" style="background:${dayC}">${dayInfo.zh}<small>${dayInfo.en.toUpperCase()}</small></div>
          <div>
            <h2 class="shelf-title">${title}<span class="shelf-title-en">${dayInfo.en}</span></h2>
          </div>
          <span class="shelf-count">${list.length} ${t("courses")}</span>
        </div>
      `;
      shelf.appendChild(books);
      root.appendChild(shelf);
    });
  }

  function bookCard(c) {
    const btn = document.createElement("button");
    btn.className = "book";
    btn.type = "button";
    btn.setAttribute("data-id", c.id);
    const sel = mode === "student" && state.picks[c.day] === c.id;
    btn.innerHTML = `
      <span class="book-cover">${posterSVG(c)}</span>
      <span class="book-name">${esc(courseName(c))}${sel ? " ✓" : ""}</span>
      <span class="book-teacher">${esc(courseTeacher(c))}</span>
    `;
    btn.addEventListener("click", () => openModal(c));
    return btn;
  }

  /* ---------------- modal ---------------- */
  let openCourseId = null;
  function openModal(c) {
    openCourseId = c.id;
    const body = $("#modalBody");
    const selected = state.picks[c.day] === c.id;
    const p = PILLARS[c.pillar];
    const pillarLabel = lzh(p.en, p.zh);
    const highlights = courseHighlights(c);
    const note = courseNote(c);

    body.innerHTML = `
      <div class="modal-poster"><span class="poster">${posterSVG(c)}</span></div>
      <div class="modal-info">
        <div class="modal-cat">
          <span class="tag">${lzh(c.categoryEn, c.categoryZh)}</span>
          <span class="tag pillar" style="background:${c.accent}">${esc(pillarLabel)}</span>
          <span class="tag" style="background:${dayColor(c.day)};color:#fff">${lzh(DAYS[c.day].en, DAYS[c.day].zh)}</span>
        </div>
        <h2 class="modal-title">${esc(courseName(c))}</h2>
        <p class="modal-title-en">${esc(c.nameEn)}</p>
        <div class="modal-teacher"><span class="t-label">${t("teacher")}</span>${esc(courseTeacher(c))}</div>

        <p class="modal-desc">${esc(courseDesc(c))}</p>

        <div class="modal-meta">
          <div class="meta-item"><b>⏰ ${t("time")}</b><span>${esc(c.time)}</span></div>
          <div class="meta-item"><b>📍 ${t("location")}</b><span>${esc(courseLocation(c))}</span></div>
          <div class="meta-item"><b>👥 ${t("capacity")}</b><span>${esc(c.capacity)}</span></div>
          <div class="meta-item"><b>🎓 ${t("grades")}</b><span>${esc(c.audience)}</span></div>
          <div class="meta-item" style="grid-column:1/-1"><b>🗣 ${t("language")}</b><span>${esc(c.language)}</span></div>
        </div>

        <p class="modal-hl-title">${t("highlights")}</p>
        <div class="modal-hl">${highlights.map((h) => `<span class="chip">${esc(h)}</span>`).join("")}</div>

        ${note ? `<div class="modal-note"><b>${t("note")}：</b>${esc(note)}</div>` : ""}

        ${mode === "student" ? `
        <div class="modal-actions">
          <button class="btn btn-primary ${selected ? "selected" : ""}" id="modalSelect">${selected ? t("selected") : t("selectThis")}</button>
          ${selected ? `<button class="btn btn-ghost" id="modalRemove">${t("cancel")}</button>` : ""}
        </div>` : `
        <div class="modal-actions"><span class="parent-hint">👨‍👩‍👧 ${t("parentBanner")}</span></div>`}
      </div>
    `;

    const selectBtn = $("#modalSelect");
    if (selectBtn) {
      selectBtn.addEventListener("click", () => {
        if (selected) { removePick(c.day); }
        else { selectPick(c); }
        openModal(c); // re-render modal state
      });
    }
    const removeBtn = $("#modalRemove");
    if (removeBtn) removeBtn.addEventListener("click", () => { removePick(c.day); openModal(c); });

    $("#modalBackdrop").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    openCourseId = null;
    $("#modalBackdrop").hidden = true;
    document.body.style.overflow = "";
  }

  /* ---------------- selection logic ---------------- */
  function selectPick(c) {
    // if this day already has a different course, replace it
    state.picks[c.day] = c.id;
    savePicks();
    renderAll();
    toast(t("changed"));
  }
  function removePick(day) {
    state.picks[day] = null;
    savePicks();
    renderAll();
    toast(t("removed"));
  }
  function savePicks() {
    localStorage.setItem("eca-picks", JSON.stringify(state.picks));
    localStorage.setItem("eca-nameZh", state.nameZh);
    localStorage.setItem("eca-nameEn", state.nameEn);
    localStorage.setItem("eca-grade", state.grade);
  }

  function renderCart() {
    $("#cartSlots").innerHTML = DAY_ORDER.map((day) => {
      const dayInfo = DAYS[day];
      const c = state.picks[day] ? courseById(state.picks[day]) : null;
      const dayC = dayColor(day);
      if (c) {
        return `<div class="cart-slot filled" style="border-color:${dayC}">
          <span class="slot-day" style="color:${dayC}">${dayInfo.zh} · ${dayInfo.en}</span>
          <span class="slot-name">${esc(courseName(c))}</span>
          <span class="slot-remove" data-day="${day}">✕ ${t("cancel")}</span>
        </div>`;
      }
      return `<div class="cart-slot">
        <span class="slot-day" style="color:${dayC}">${dayInfo.zh} · ${dayInfo.en}</span>
        <span class="slot-empty">${lang === "zh" ? "尚未选择" : "Not selected"}</span>
      </div>`;
    }).join("");

    const count = DAY_ORDER.filter((d) => state.picks[d]).length;
    $("#cartCount").textContent = `${count} / 3`;
    const infoComplete = state.nameZh.trim() && state.nameEn.trim() && state.grade;
    $("#cartSubmit").disabled = !(count === 3 && infoComplete);

    document.querySelectorAll(".slot-remove").forEach((el) => {
      el.addEventListener("click", () => { removePick(el.getAttribute("data-day")); });
    });

    const msg = serverAvailable ? "" : t("serverOffline");
    $("#cartMsg").textContent = msg;
  }

  /* ---------------- submit ---------------- */
  async function submit() {
    if (!state.nameZh.trim() || !state.nameEn.trim() || !state.grade) {
      toast(t("emptyName"));
      if (!state.nameZh.trim()) $("#nameZh").focus();
      else if (!state.nameEn.trim()) $("#nameEn").focus();
      else $("#grade").focus();
      return;
    }
    const count = DAY_ORDER.filter((d) => state.picks[d]).length;
    if (count < 3) { toast(t("pickAll")); return; }

    const payload = {
      nameZh: state.nameZh.trim(),
      nameEn: state.nameEn.trim(),
      grade: state.grade,
      monday: state.picks.monday,
      tuesday: state.picks.tuesday,
      wednesday: state.picks.wednesday,
      timestamp: new Date().toISOString()
    };

    let ok = false;
    if (serverAvailable) {
      try {
        const res = await fetch("/api/selection", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        ok = res.ok;
      } catch (e) { ok = false; }
    }
    state.submitted = true;
    localStorage.setItem("eca-submitted", "1");
    toast(ok ? t("submittedServer") : t("submitted"));
    confettiBurst();
  }

  /* ---------------- toast & confetti ---------------- */
  let toastTimer = null;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  function confettiBurst() {
    const canvas = $("#confetti");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const colors = ["#f59e0b", "#ec4899", "#10b981", "#3b82f6", "#8b5cf6", "#ef4444", "#22c55e"];
    const parts = [];
    for (let i = 0; i < 160; i++) {
      parts.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height * 0.4,
        w: 6 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        c: colors[(Math.random() * colors.length) | 0],
        vy: 2.2 + Math.random() * 3.2,
        vx: (Math.random() - 0.5) * 1.6,
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 8
      });
    }
    let frames = 0;
    function step() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let alive = false;
      parts.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.02;
        if (p.y < canvas.height + 40) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (alive && frames < 240) { frames++; requestAnimationFrame(step); }
      else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }
    requestAnimationFrame(step);
  }

  /* ---------------- render all ---------------- */
  function applyMode() {
    const isParent = mode === "parent";
    document.body.classList.toggle("parent-mode", isParent);
    $("#identity").hidden = isParent;
    $("#cart").hidden = isParent;
    $("#parentBanner").hidden = !isParent;
    document.querySelectorAll(".mode-btn").forEach((b) => {
      b.classList.toggle("active", b.getAttribute("data-mode") === mode);
    });
  }

  function renderAll() {
    renderPillars();
    renderShelves();
    renderCart();
    applyMode();
  }

  /* ---------------- server probe ---------------- */
  async function probeServer() {
    try {
      const res = await fetch("/api/health", { method: "GET" });
      serverAvailable = res.ok;
    } catch (e) { serverAvailable = false; }
    renderCart();
  }

  /* ---------------- events ---------------- */
  function bindEvents() {
    document.querySelectorAll(".mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        mode = btn.getAttribute("data-mode") === "parent" ? "parent" : "student";
        const url = new URL(location.href);
        if (mode === "parent") url.searchParams.set("view", "parent");
        else url.searchParams.delete("view");
        history.replaceState(null, "", url);
        closeModal();
        renderAll();
      });
    });

    $("#langToggle").addEventListener("click", () => {
      lang = lang === "zh" ? "en" : "zh";
      localStorage.setItem("eca-lang", lang);
      applyLang();
      renderAll();
      if (openCourseId) {
        const c = courseById(openCourseId);
        if (c) openModal(c);
      }
    });

    $("#nameZh").addEventListener("input", (e) => { state.nameZh = e.target.value; savePicks(); renderCart(); });
    $("#nameEn").addEventListener("input", (e) => { state.nameEn = e.target.value; savePicks(); renderCart(); });
    $("#grade").addEventListener("change", (e) => { state.grade = e.target.value; savePicks(); renderCart(); });

    $("#cartSubmit").addEventListener("click", submit);
    $("#modalClose").addEventListener("click", closeModal);
    $("#modalBackdrop").addEventListener("click", (e) => {
      if (e.target === $("#modalBackdrop")) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  }

  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (key === "heroSub") {
        el.innerHTML = t(key).replace("{days}", `<span class="hl">${esc(t("days"))}</span>`);
      } else {
        el.textContent = t(key);
      }
    });
    $("#nameZh").placeholder = lang === "zh" ? "中文名 Chinese name" : "Chinese name 中文名";
    $("#nameEn").placeholder = lang === "zh" ? "英文名 English name" : "English name 英文名";
    $("#langToggle").textContent = lang === "zh" ? "中文 / EN" : "EN / 中文";
  }

  /* ---------------- init ---------------- */
  function init() {
    $("#nameZh").value = state.nameZh;
    $("#nameEn").value = state.nameEn;
    $("#grade").value = state.grade;
    applyLang();
    bindEvents();
    renderAll();
    probeServer();
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
