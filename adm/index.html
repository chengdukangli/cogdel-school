<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>成都康礼学校 · 招生管理系统</title>
<style>
  :root { --purple:#4B2E83; --gold:#C9A227; --ink:#1d1d1f; --muted:#6e6e73; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#faf8ff 0%,#f3f0fa 45%,#fdf8ec 100%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); padding:24px;
  }
  .card {
    width:100%; max-width:420px; background:#fff; border-radius:22px; padding:36px 28px 30px;
    box-shadow:0 18px 46px rgba(75,46,131,.13); text-align:center;
  }
  .logo { width:64px; height:64px; border-radius:16px; margin:0 auto 16px;
    background:linear-gradient(140deg,var(--purple),#6b4bab); color:#fff; display:flex;
    align-items:center; justify-content:center; font-size:26px; font-weight:700; letter-spacing:1px; }
  h1 { font-size:21px; margin:0 0 6px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:26px; }
  .enter {
    display:block; width:100%; padding:16px 0; border-radius:14px; text-decoration:none;
    background:linear-gradient(135deg,var(--purple),#5c3a99); color:#fff; font-size:17px; font-weight:600;
    letter-spacing:1px; box-shadow:0 10px 24px rgba(75,46,131,.28); transition:transform .15s ease;
  }
  .enter:active { transform:scale(.98); }
  .tip { color:var(--muted); font-size:12px; line-height:1.7; margin-top:18px; }
  .line { height:2px; width:52px; margin:20px auto 16px; background:var(--gold); border-radius:2px; opacity:.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">礼</div>
    <h1>成都康礼学校</h1>
    <div class="sub">招生管理系统 · Admissions Management</div>
    <a class="enter" href="http://118.24.139.114:4001" target="_blank" rel="noopener">进入招生系统</a>
    <div class="line"></div>
    <div class="tip">
      官方渠道 · 招生办专用<br />
      手机号 + 密码登录；从钉钉提醒进入可直接打开
    </div>
  </div>
</body>
</html>
