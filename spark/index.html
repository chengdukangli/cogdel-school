<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的八维火花 · 8-Dimension Spark</title>
<style>
  :root{--bg:#FFFFFF; --card:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --purple:#4A3B72; --gold:#D9B45B; --line:#E5E5EA;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .app{width:100%;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .screen{display:none;flex-direction:column;flex:1;padding:60px 28px 40px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .screen.active{display:flex;animation:fadein .5s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:600;}
  h1{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
  .en{display:block;font-size:.62em;color:var(--muted);font-weight:400;letter-spacing:normal;margin-top:5px;line-height:1.4;}
  .en-i{font-size:.68em;color:var(--muted);font-weight:400;}
  .sub{font-size:17px;color:var(--muted);line-height:1.55;margin-top:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;text-align:center;padding:17px 28px;border:none;border-radius:999px;font-size:17px;font-weight:600;cursor:pointer;background:var(--purple);color:#fff;transition:.18s;}
  .btn:active{opacity:.75;transform:scale(.99);}
  .btn.secondary{background:var(--card);color:var(--purple);}
  .link{display:inline-block;font-size:16px;color:var(--purple);font-weight:500;cursor:pointer;text-decoration:none;}
  .link:after{content:" ›";}
  .mascot{width:100%;height:auto;display:block;}
  .float{animation:fl 4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  #intro{justify-content:center;text-align:left;padding-top:70px;}
  .mascot-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;margin:36px 0 12px;}
  .mascot-row .m{width:70px;margin:0 auto;}
  #intro h1{margin-top:10px;}
  #intro .btn{margin-top:40px;}
  #intro .foot{margin-top:22px;font-size:13px;color:var(--muted);}
  #quiz .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .qnum{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.05em;}
  .bar{height:4px;background:#EDEDF0;border-radius:2px;overflow:hidden;margin-bottom:36px;}
  .bar>div{height:100%;background:var(--purple);transition:width .3s;border-radius:2px;}
  #quiz h2{font-size:24px;line-height:1.4;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-bottom:26px;}
  .opts{display:flex;flex-direction:column;gap:13px;}
  .opt{text-align:left;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:15.5px;line-height:1.45;cursor:pointer;transition:.15s;display:flex;align-items:flex-start;}
  .opt:active{background:var(--card);transform:scale(.99);}
  .opt .key{flex:none;width:26px;height:26px;line-height:26px;text-align:center;background:var(--card);color:var(--purple);border-radius:50%;font-size:13px;font-weight:700;margin-right:13px;margin-top:2px;}
  #result{padding:52px 28px 44px;align-items:center;}
  .reveal{text-align:center;width:100%;}
  .reveal .mm{width:110px;margin:0 auto 18px;}
  .reveal h2{font-size:32px;}
  .reveal .oneliner{font-size:15px;color:var(--muted);margin-top:8px;}
  .meta{margin-top:14px;display:inline-block;background:var(--card);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;color:var(--purple);}
  .lukun{margin-top:12px;font-size:12.5px;color:var(--muted);}
  .radar-wrap{margin:34px 0;display:flex;justify-content:center;}
  canvas#radar{width:280px;height:280px;}
  .insight{width:100%;background:var(--card);border-radius:22px;padding:22px;}
  .insight p{font-size:15.5px;line-height:1.7;color:var(--ink);}
  .duo{width:100%;display:flex;gap:14px;margin-top:14px;}
  .duo .card{flex:1;background:var(--card);border-radius:20px;padding:16px;}
  .duo .card .t{font-size:12px;letter-spacing:.08em;margin-bottom:6px;font-weight:600;}
  .duo .card .v{font-size:14px;line-height:1.6;color:var(--ink);}
  .duo .card.power .t{color:#B8860B;}
  .duo .card.soft .t{color:var(--purple);}
  .gentle{width:100%;margin-top:14px;background:var(--card);border-radius:20px;padding:16px 18px;}
  .gentle .t{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .gentle .v{font-size:14px;line-height:1.6;color:var(--ink);}
  .actions{width:100%;margin-top:38px;display:flex;flex-direction:column;gap:15px;align-items:center;}
  .kangli-block{width:100%;margin-top:44px;padding-top:30px;border-top:1px solid var(--line);text-align:center;}
  .kangli-block .logo{font-size:14px;color:var(--ink);font-weight:700;}
  .kangli-block p{font-size:14px;color:var(--muted);line-height:1.7;margin:10px 0 18px;}
  .kangli-block .btn{font-size:16px;}
  #shareCard{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  #shareCard.show{display:flex;}
  .card-inner{width:100%;max-width:350px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:28px;padding:26px 22px;text-align:center;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.2);transition:background .4s;}
  .card-inner .close{position:absolute;top:14px;right:18px;font-size:22px;color:var(--muted);cursor:pointer;}
  .card-inner .cm{width:92px;margin:0 auto;}
  .card-inner h3{font-size:24px;color:var(--ink);font-weight:700;letter-spacing:-.01em;margin-top:4px;}
  .card-inner .c-one{font-size:13.5px;color:var(--muted);margin-top:6px;}
  .card-inner .c-meta{margin-top:12px;font-size:14px;font-weight:600;color:var(--purple);}
  canvas#radar2{width:220px;height:220px;margin:12px auto;display:block;}
  .card-inner .c-line{font-size:14.5px;line-height:1.6;color:var(--ink);}
  .card-inner .c-invite{margin-top:16px;font-size:15px;color:var(--purple);font-weight:700;line-height:1.5;}
  .c-kangli{margin-top:13px;font-size:12px;color:var(--muted);font-weight:600;}
  .card-inner .hint{margin-top:8px;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="intro">
    <div class="eyebrow" id="i-eyebrow"></div>
    <h1 id="i-title"></h1>
    <div class="mascot-row" id="mascotRow"></div>
    <p class="sub" id="i-sub"></p>
    <button class="btn" id="i-start" onclick="start()"></button>
    <p class="foot" id="i-foot"></p>
  </div>
  <div class="screen" id="quiz">
    <div class="top"><span class="qnum" id="qnum"></span></div>
    <div class="bar"><div id="barfill" style="width:0%"></div></div>
    <h2 id="qtext"></h2>
    <div class="opts" id="opts"></div>
  </div>
  <div class="screen" id="result">
    <div class="reveal">
      <div class="mm float" id="r-mascot"></div>
      <h2 id="r-label"></h2>
      <div class="oneliner" id="r-oneliner"></div>
      <div class="meta" id="r-meta"></div>
      <div class="lukun" id="r-lukun"></div>
    </div>
    <div class="radar-wrap"><canvas id="radar" width="540" height="540"></canvas></div>
    <div class="insight" id="r-insight"></div>
    <div class="duo">
      <div class="card power"><div class="t" id="r-power-t"></div><div class="v" id="r-power"></div></div>
      <div class="card soft"><div class="t" id="r-soft-t"></div><div class="v" id="r-soft"></div></div>
    </div>
    <div class="gentle"><div class="t" id="r-gentle-t"></div><div class="v" id="r-gentle"></div></div>
    <div class="actions">
      <button class="btn" id="r-share" onclick="showShareCard()"></button>
      <span class="link" id="r-copy" onclick="copyShare()"></span>
      <span class="link" id="r-retake" onclick="restart()"></span>
    </div>
    <div class="kangli-block">
      <div class="logo" id="r-klogo"></div>
      <p id="r-kp"></p>
      <button class="btn secondary" id="r-kbtn" onclick="window.open('landing.html','_blank')"></button>
    </div>
  </div>
</div>
<div id="shareCard">
  <div class="card-inner" id="cardInner">
    <span class="close" onclick="hideShareCard()">×</span>
    <div class="cm float" id="c-mascot"></div>
    <h3 id="c-label"></h3>
    <div class="c-one" id="c-one"></div>
    <div class="c-meta" id="c-meta"></div>
    <canvas id="radar2" width="460" height="460"></canvas>
    <div class="c-line" id="c-line"></div>
    <div class="c-invite" id="c-invite"></div>
    <div class="c-kangli" id="c-kangli"></div>
    <div class="hint" id="c-hint"></div>
  </div>
</div>
<script>
const DIMS=[
  {id:'wellbeing',zh:'身心',en:'Wellbeing',color:'#3FBF9E'},
  {id:'learning',zh:'学习力',en:'Learning',color:'#5B9BD5'},
  {id:'innovation',zh:'创新力',en:'Innovation',color:'#F2B33D'},
  {id:'agency',zh:'内驱力',en:'Agency',color:'#FF7A45'},
  {id:'leadership',zh:'领导力',en:'Leadership',color:'#E0555A'},
  {id:'collaboration',zh:'协作',en:'Collaboration',color:'#8BC34A'},
  {id:'vision',zh:'视野',en:'Vision',color:'#9B6BD6'},
  {id:'stewardship',zh:'责任',en:'Stewardship',color:'#5C6B8A'},
];
const POOL=[
  {t:["一个没人监督的周六，你本来计划做点正事。你最后会？","On an unsupervised Saturday, you planned to get something done. What actually happens?"],o:[
    {d:'agency',k:'A',x:["按计划做完，心里才踏实","Finish it as planned — then I can relax"]},
    {d:'collaboration',k:'B',x:["拉个人一起，有人陪才做得动","Grab a buddy; I work better with company"]},
    {d:'wellbeing',k:'C',x:["先睡饱、吃好，状态对了再动手","Sleep and eat first; start when I'm in the right state"]},
    {d:'innovation',k:'D',x:["突然冒出个新点子，正事扔一边先搞它","A new idea pops up — I drop the plan and chase it"]}]},
  {t:["聚餐点菜，所有人齐声“随便”。你会？","Dinner ordering, everyone says \"whatever\". You?"],o:[
    {d:'leadership',k:'A',x:["直接拍板一家，不好吃再换","Just decide on one; if it's bad, we switch"]},
    {d:'collaboration',k:'B',x:["挨个问一圈，折中出大家能接受的","Ask around, find what everyone accepts"]},
    {d:'agency',k:'C',x:["心里有家想去的，但没好意思说","I have a place in mind, but I don't say it"]},
    {d:'vision',k:'D',x:["想的是：这顿饭之后，大家还能一起做点啥","Thinking: what can we do together after this meal?"]}]},
  {t:["家里多了个快递纸箱，你的第一反应是？","A delivery box shows up at home. Your first thought?"],o:[
    {d:'stewardship',k:'A',x:["拿来收纳，物尽其用","Use it for storage — waste not"]},
    {d:'innovation',k:'B',x:["想它能改造成个啥","What can I turn this into?"]},
    {d:'wellbeing',k:'C',x:["先放着，等猫去玩","Leave it for the cat to play with"]},
    {d:'learning',k:'D',x:["研究下这箱子的承重和结构","Check its load capacity and structure"]}]},
  {t:["遇到一个完全没接触过的新东西，你的第一动作是？","Faced with something totally new, your first move?"],o:[
    {d:'learning',k:'A',x:["自己搜资料、翻教程，先搞懂","Search and read up; figure it out myself"]},
    {d:'collaboration',k:'B',x:["逮住一个懂的人直接问","Find someone who knows and ask"]},
    {d:'innovation',k:'C',x:["先上手瞎试，错了再改","Just try it, fix mistakes as I go"]},
    {d:'agency',k:'D',x:["先收藏，四舍五入等于学会了","Bookmark it — that basically counts as learning it"]}]},
  {t:["老师宣布“下周交小组作业”，你脑子里第一个声音是？","Teacher says \"group project due next week\". First voice in your head?"],o:[
    {d:'leadership',k:'A',x:["“我来组队分任务”","\"I'll organize the team and tasks\""]},
    {d:'collaboration',k:'B',x:["“别让我当组长就行”","\"Just don't make me the leader\""]},
    {d:'wellbeing',k:'C',x:["“完了，又要拖 / 又要被拖”","\"Oh no — I'll drag or get dragged\""]},
    {d:'stewardship',k:'D',x:["“我先把我的那部分想清楚”","\"Let me think through my part first\""]}]},
  {t:["最近压力很大，你的真实状态更接近？","Under heavy stress, you're more like?"],o:[
    {d:'wellbeing',k:'A',x:["身体先抗议：失眠 / 胃痛 / 头痛","My body complains first: insomnia / stomach / headache"]},
    {d:'agency',k:'B',x:["越压越清醒，反而更想做事","Pressure wakes me up; I want to do more"]},
    {d:'vision',k:'C',x:["退一步想：这事放在三年后还重要吗","Step back: will this matter in three years?"]},
    {d:'innovation',k:'D',x:["躲进一个新领域 / 新爱好里缓缓","Escape into a new interest to recharge"]}]},
  {t:["刷到一个全网吵翻的热搜，你的第一反应是？","A hot topic is blowing up online. Your first reaction?"],o:[
    {d:'vision',k:'A',x:["“这事背后是什么逻辑”","\"What's the logic behind this?\""]},
    {d:'learning',k:'B',x:["“他们到底在吵什么，我去查查”","\"What are they fighting about? Let me look it up\""]},
    {d:'stewardship',k:'C',x:["“这会不会影响到谁，该不该发声”","\"Who might this affect? Should I speak up?\""]},
    {d:'collaboration',k:'D',x:["顺手转给朋友，看TA怎么说","Forward it to a friend, see what they think"]}]},
  {t:["地上有个空瓶，周围没人，你会？","An empty bottle on the ground, no one around. You?"],o:[
    {d:'stewardship',k:'A',x:["捡起来扔了","Pick it up and bin it"]},
    {d:'wellbeing',k:'B',x:["看一眼，继续走","Glance at it, keep walking"]},
    {d:'leadership',k:'C',x:["拍下来，发群里“谁干的”","Take a photo and ask \"who did this?\" in the group"]},
    {d:'learning',k:'D',x:["顺手记下：这附近该加个垃圾桶","Note: this area needs a trash can"]}]},
  {t:["想象十年后的自己，你的画面更可能是？","Imagine yourself in ten years. Closer to which picture?"],o:[
    {d:'leadership',k:'A',x:["在某个领域成了“能说了算的人”","Someone who \"calls the shots\" in their field"]},
    {d:'learning',k:'B',x:["还在学新东西，停不下来","Still learning new things, never stopping"]},
    {d:'vision',k:'C',x:["去了很多地方，见过更大的世界","Been to many places, seen a bigger world"]},
    {d:'collaboration',k:'D',x:["有一群处得来、彼此照应的人","A circle of friends who truly have each other"]}]},
  {t:["你更受不了哪种“队友”？","Which \"teammate\" do you hate most?"],o:[
    {d:'leadership',k:'A',x:["什么都不管、等别人安排","One who does nothing and waits for orders"]},
    {d:'stewardship',k:'B',x:["不守时、答应的事老掉链子","One who's never on time and breaks promises"]},
    {d:'innovation',k:'C',x:["只会照做、没有自己的想法","One who just follows orders, no ideas"]},
    {d:'agency',k:'D',x:["一遇困难就躺平、没人推就不动","One who gives up and won't move without a push"]}]},
  {t:["深夜11点，你明天的任务还没做完。你会？","11pm, tomorrow's task isn't done. You?"],o:[
    {d:'agency',k:'A',x:["熬夜做完，睡不踏实更难受","Stay up — leaving it undone feels worse"]},
    {d:'wellbeing',k:'B',x:["先睡，明天早起赶","Sleep first, wake early and rush it"]},
    {d:'collaboration',k:'C',x:["叫个朋友一起肝","Call a friend to grind together"]},
    {d:'innovation',k:'D',x:["边做边想：有没有更省事的办法","Work while thinking: is there a smarter way?"]}]},
  {t:["群里有人发了个拼团链接，你的第一反应是？","Someone posts a group-buy link in chat. Your first reaction?"],o:[
    {d:'stewardship',k:'A',x:["顺手帮点一下","Tap to help them out"]},
    {d:'wellbeing',k:'B',x:["假装没看见","Pretend I didn't see it"]},
    {d:'learning',k:'C',x:["研究下这东西到底值不值","Research whether it's actually worth it"]},
    {d:'collaboration',k:'D',x:["问他“还差几个，我帮你转”","Ask \"how many more do you need? I'll share it\""]}]},
  {t:["临时被拉去主持一个活动，你会？","You're suddenly asked to host an event. You?"],o:[
    {d:'leadership',k:'A',x:["硬着头皮上，边做边学","Take it on, learn as I go"]},
    {d:'collaboration',k:'B',x:["先拉个人一起商量流程","Pull someone in to plan together"]},
    {d:'wellbeing',k:'C',x:["心里慌，但表面稳","Panic inside, calm outside"]},
    {d:'innovation',k:'D',x:["趁机加点自己的创意环节","Add my own creative twist to it"]}]},
  {t:["到一个陌生城市旅行，你会？","Traveling to a new city. You?"],o:[
    {d:'learning',k:'A',x:["提前做攻略，按计划走","Plan ahead, follow the itinerary"]},
    {d:'collaboration',k:'B',x:["先找当地人问哪里好玩","Ask a local what's good"]},
    {d:'vision',k:'C',x:["专挑博物馆 / 老城区，看历史","Head to museums / old town, soak up history"]},
    {d:'innovation',k:'D',x:["走一条没人的小路，看能发现啥","Take an empty path, see what I discover"]}]},
  {t:["朋友心情不好找你，你的第一反应是？","A friend is upset and comes to you. Your first response?"],o:[
    {d:'stewardship',k:'A',x:["先听TA说完，不急着给建议","Just listen, no rush to advise"]},
    {d:'learning',k:'B',x:["帮TA把问题一层层捋清楚","Help them untangle it layer by layer"]},
    {d:'wellbeing',k:'C',x:["拉TA出去散心、吃顿好的","Take them out for food / fresh air"]},
    {d:'vision',k:'D',x:["问TA“最坏会怎样”，帮TA换个角度","Ask \"what's the worst that could happen?\" to shift their view"]}]},
  {t:["你的手机 / 电脑桌面，通常是？","Your phone / computer desktop is usually?"],o:[
    {d:'stewardship',k:'A',x:["分门别类，井井有条","Tidy, everything categorized"]},
    {d:'agency',k:'B',x:["随手放，但我知道东西在哪","Scattered, but I know where everything is"]},
    {d:'innovation',k:'C',x:["常换各种好看的壁纸 / 主题","Always changing wallpapers / themes"]},
    {d:'wellbeing',k:'D',x:["有点乱，但“乱中有序”","A bit messy, but \"organized chaos\""]}]},
  {t:["面对一件“必须做但很不想做”的事，你会？","Faced with a \"must-do but really don't want to\" task. You?"],o:[
    {d:'learning',k:'A',x:["拆成小步骤，一个个啃","Break it into small steps, chew through them"]},
    {d:'agency',k:'B',x:["设个奖励，做完才兑现","Set a reward, only after I finish"]},
    {d:'collaboration',k:'C',x:["找人监督 / 一起做","Get someone to supervise / do it with me"]},
    {d:'wellbeing',k:'D',x:["先做5分钟，做着做着就进去了","Just do 5 minutes — I'll get into the flow"]}]},
  {t:["你理想中的“朋友”，更接近？","Your ideal \"friend\" is closer to?"],o:[
    {d:'leadership',k:'A',x:["能一起搞事情、互相成就的","Someone to build things with, achieving together"]},
    {d:'collaboration',k:'B',x:["能随时说话、彼此接住的","Someone I can talk to anytime, who has my back"]},
    {d:'vision',k:'C',x:["能带我看更大世界、长见识的","Someone who shows me a bigger world"]},
    {d:'stewardship',k:'D',x:["不用常联系、但一直在的","Someone who stays, even without constant contact"]}]},
  {t:["排队时，前面有人插队，你会？","Someone cuts in line ahead of you. You?"],o:[
    {d:'leadership',k:'A',x:["直接说“请排队”","Say directly: \"please queue up\""]},

function faceSVG(expr){const eyes=expr==='calm'?'<path d="M52 46 Q60 40 68 46" stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M72 46 Q80 40 88 46" stroke="#3a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>':'<circle cx="59" cy="46" r="6" fill="#fff"/><circle cx="81" cy="46" r="6" fill="#fff"/><circle cx="60" cy="47" r="3" fill="#3a3a3a"/><circle cx="80" cy="47" r="3" fill="#3a3a3a"/><circle cx="61" cy="45" r="1.3" fill="#fff"/><circle cx="81" cy="45" r="1.3" fill="#fff"/>';let m='';switch(expr){case 'determined':m='<path d="M64 60 L76 60" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>';break;case 'grin':m='<path d="M63 56 Q70 66 77 56 Z" fill="#3a3a3a"/>';break;case 'smirk':m='<path d="M63 58 Q70 62 77 57" stroke="#3a3a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';break;case 'curious':m='<ellipse cx="70" cy="59" rx="3.5" ry="4.5" fill="#3a3a3a"/>';break;case 'calm':m='<path d="M65 59 Q70 62 75 59" stroke="#3a3a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';break;case 'steady':m='<path d="M64 59 Q70 62 76 59" stroke="#3a3a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';break;default:m='<path d="M64 58 Q70 63 76 58" stroke="#3a3a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>';}return eyes+m;}
function accSVG(type){switch(type){case 'flame':return '<path d="M70 0 Q77 9 77 15 Q77 21 70 21 Q63 21 63 15 Q63 9 70 0Z" fill="#FFB84D"/><path d="M70 12 Q73 14 70 18 Q67 14 70 12Z" fill="#FF8A3D"/>';case 'crown':return '<path d="M50 15 L54 5 L62 12 L70 2 L78 12 L86 5 L90 15 Z" fill="#F6C445" stroke="#D9A520" stroke-width="1.5" stroke-linejoin="round"/>';case 'bulb':return '<circle cx="70" cy="8" r="7" fill="#FFF3C4" stroke="#E0A93D" stroke-width="1.5"/><path d="M67 14 h6" stroke="#E0A93D" stroke-width="1.5"/>';case 'hearts':return '<path d="M30 34 q-5 -7 -10 0 q-5 7 0 12 q4 4 10 9 q6 -5 10 -9 q5 -5 0 -12 q-5 -7 -10 0Z" fill="#FF8A9E"/><path d="M102 28 q-4 -5 -8 0 q-4 5 0 10 q3 3 8 7 q5 -4 8 -7 q4 -4 0 -10 q-4 -5 -8 0Z" fill="#FFB3C0"/>';case 'glasses':return '<circle cx="59" cy="46" r="9" fill="none" stroke="#3a3a3a" stroke-width="2"/><circle cx="81" cy="46" r="9" fill="none" stroke="#3a3a3a" stroke-width="2"/><path d="M68 46 h4" stroke="#3a3a3a" stroke-width="2"/>';case 'anchor':return '<g stroke="#2C7A6B" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="70" y1="92" x2="70" y2="108"/><line x1="63" y1="100" x2="77" y2="100"/><path d="M65 108 a5 5 0 0 0 10 0"/><line x1="70" y1="113" x2="70" y2="116"/></g>';case 'star':return '<path d="M70 0 l3 7 7 1 -5.5 5 1.5 7.5 -6 -4 -6 4 1.5 -7.5 -5.5 -5 7 -1Z" fill="#FFE08A"/>';case 'shield':return '<path d="M70 90 L86 95 V105 Q86 115 70 122 Q54 115 54 105 V95 Z" fill="#8A9DC0" stroke="#5C6B8A" stroke-width="1.5" stroke-linejoin="round"/>';case 'hex':return '<path d="M70 2 L86 11 V29 L70 38 L54 29 V11 Z" fill="#EBD49B" stroke="#D9B45B" stroke-width="2" stroke-linejoin="round"/>';}return '';}
function mascotSVG(cfg){const skin='#F8DCC0';return '<svg class="mascot" viewBox="0 0 140 150">'
  +'<ellipse cx="52" cy="143" rx="11" ry="5.5" fill="#3a3a3a"/><ellipse cx="88" cy="143" rx="11" ry="5.5" fill="#3a3a3a"/>'
  +'<rect x="46" y="116" width="12" height="26" rx="5" fill="'+cfg.c1+'"/><rect x="82" y="116" width="12" height="26" rx="5" fill="'+cfg.c1+'"/>'
  +'<path d="M44 78 Q70 70 96 78 L96 122 Q70 130 44 122 Z" fill="'+cfg.c1+'"/>'
  +'<path d="M46 82 Q30 88 27 102 Q33 108 43 98 Z" fill="'+cfg.c1+'"/><path d="M94 82 Q110 88 113 102 Q107 108 97 98 Z" fill="'+cfg.c1+'"/>'
  +'<circle cx="29" cy="104" r="5" fill="'+skin+'"/><circle cx="111" cy="104" r="5" fill="'+skin+'"/>'
  +'<circle cx="70" cy="48" r="30" fill="'+skin+'"/>'
  +'<circle cx="41" cy="50" r="4.5" fill="'+skin+'"/><circle cx="99" cy="50" r="4.5" fill="'+skin+'"/>'
  + hairSVG(cfg.hair,cfg.c1)+ faceSVG(cfg.expr||'smile')
  +'<ellipse cx="55" cy="56" rx="5" ry="3" fill="#F6A0B0" opacity="0.6"/><ellipse cx="85" cy="56" rx="5" ry="3" fill="#F6A0B0" opacity="0.6"/>'
  + accSVG(cfg.acc)+'</svg>';}
function charHTML(cfg){const svg=encodeURIComponent(mascotSVG(cfg));return '<img class="mascot" src="'+cfg.key+'.png" onerror="this.outerHTML=decodeURIComponent(\''+svg+'\')">';}
let selected=[],appear={},score={},qi=0,shareText='',resultData=null;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function pickQuestions(n){const shuffled=[...POOL].sort(()=>Math.random()-0.5);const cnt={};DIMS.forEach(d=>cnt[d.id]=0);const picked=[];const rest=[...shuffled];while(picked.length<n&&rest.length){let bi=0,bs=Infinity;rest.forEach((q,idx)=>{let need=0;q.o.forEach(o=>need+=cnt[o.d]);if(need<bs){bs=need;bi=idx;}});const q=rest.splice(bi,1)[0];q.o.forEach(o=>cnt[o.d]++);picked.push(q);}const ap={};DIMS.forEach(d=>ap[d.id]=0);picked.forEach(q=>q.o.forEach(o=>ap[o.d]++));return{picked,ap};}
function start(){DIMS.forEach(d=>score[d.id]=0);const r=pickQuestions(12);selected=r.picked;appear=r.ap;qi=0;renderQ();show('quiz');}
function renderQ(){const q=selected[qi];document.getElementById('qnum').textContent=(qi+1)+' / '+selected.length;document.getElementById('barfill').style.width=(qi/selected.length*100)+'%';document.getElementById('qtext').innerHTML=q.t[0]+'<span class="en">'+q.t[1]+'</span>';const box=document.getElementById('opts');box.innerHTML='';q.o.forEach(op=>{const b=document.createElement('div');b.className='opt';b.innerHTML='<span class="key">'+op.k+'</span><span>'+op.x[0]+' <span class="en-i">'+op.x[1]+'</span></span>';b.onclick=()=>answer(op.d);box.appendChild(b);});}
function answer(dim){score[dim]+=2;qi++;if(qi<selected.length){renderQ();}else{compute();}}
function compute(){const arr=DIMS.map(d=>({id:d.id,s:score[d.id]})).sort((a,b)=>b.s-a.s);let p;if(arr[0].s-arr[7].s<=2){p=BALANCED;}else{p=PERSONAS[arr[0].id];}const bottom=arr[arr.length-1];const pct=DIMS.map(d=>appear[d.id]>0?Math.round(score[d.id]/(appear[d.id]*2)*100):0);resultData={p,bottomId:bottom.id,pct};renderResult();show('result');}
function renderResult(){const{p,bottomId,pct}=resultData;
  document.getElementById('r-mascot').innerHTML=charHTML(p);
  document.getElementById('r-label').innerHTML=p.label[0]+'<span class="en">'+p.label[1]+'</span>';
  document.getElementById('r-oneliner').innerHTML=p.one[0]+'<span class="en">'+p.one[1]+'</span>';
  document.getElementById('r-meta').innerHTML='🌠 '+p.rarity[0]+'<span class="en">'+p.rarity[1]+'</span>';
  document.getElementById('r-lukun').innerHTML='陆琨校长也测了，她是「自燃型」。你呢？<span class="en">Principal Lu Kun took it too — she\'s a Self-Starter. You?</span>';
  document.getElementById('r-insight').innerHTML='<p>'+p.ins[0]+'</p><p class="en">'+p.ins[1]+'</p>';
  document.getElementById('r-power-t').textContent='你的超能力 Your superpower';
  document.getElementById('r-soft-t').textContent='你的软肋 Your soft spot';
  document.getElementById('r-gentle-t').textContent='悄悄说一句 A little note';
  document.getElementById('r-power').innerHTML=p.power[0]+'<span class="en">'+p.power[1]+'</span>';
  document.getElementById('r-soft').innerHTML=p.soft[0]+'<span class="en">'+p.soft[1]+'</span>';
  document.getElementById('r-gentle').innerHTML=GENTLE[bottomId][0]+'<span class="en">'+GENTLE[bottomId][1]+'</span>';
  document.getElementById('r-share').textContent='晒出我的火花图 · Share';
  document.getElementById('r-copy').textContent='复制结果文案 Copy';
  document.getElementById('r-retake').textContent='再测一次 Retake';
  document.getElementById('r-klogo').textContent='成都康礼学校 · Cogdel School Chengdu';
  document.getElementById('r-kp').innerHTML='每个孩子的火花，都值得被看见。<span class="en">Every child\'s spark deserves to be seen.</span>';
  document.getElementById('r-kbtn').textContent='了解火花计划 Learn More';
  drawRadar('radar',pct);
  document.getElementById('cardInner').style.background=p.c2;
  document.getElementById('c-mascot').innerHTML=charHTML(p);
  document.getElementById('c-label').innerHTML=p.label[0]+'<span class="en">'+p.label[1]+'</span>';
  document.getElementById('c-one').innerHTML=p.one[0]+'<span class="en">'+p.one[1]+'</span>';
  document.getElementById('c-meta').innerHTML='🌠 '+p.rarity[0]+'<span class="en">'+p.rarity[1]+'</span>';
  document.getElementById('c-line').innerHTML=p.ins[0].split('。')[0]+'。<span class="en">'+p.ins[1].split('.')[0]+'.</span>';
  document.getElementById('c-invite').innerHTML='你的火花是什么形状？来测，看我们合不合<span class="en">What shape is your spark? Take it and see if we match</span>';
  document.getElementById('c-kangli').textContent='成都康礼学校 · Cogdel School Chengdu';
  document.getElementById('c-hint').textContent='长按或截图保存这张图 · Long-press or screenshot to save';
  drawRadar('radar2',pct);
  shareText='我居然是「'+p.label[0]+'」——'+p.rarity[0]+'！你的八维火花是什么形状？来测，看看我们的火花合不合 → '+SHARE_URL;
}
function drawRadar(cid,pct){const c=document.getElementById(cid),ctx=c.getContext('2d');const W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.32,n=DIMS.length;ctx.clearRect(0,0,W,H);const ang=i=>-Math.PI/2+i*(2*Math.PI/n);const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];ctx.strokeStyle='#E5E5EA';ctx.lineWidth=1;for(let l=1;l<=4;l++){const r=R*l/4;ctx.beginPath();for(let i=0;i<n;i++){const[x,y]=pt(i,r);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();}for(let i=0;i<n;i++){const[x,y]=pt(i,R);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();}ctx.beginPath();for(let i=0;i<n;i++){const r=R*pct[i]/100;const[x,y]=pt(i,r);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fillStyle='rgba(217,180,91,0.30)';ctx.fill();ctx.strokeStyle='#D9B45B';ctx.lineWidth=2.5;ctx.stroke();for(let i=0;i<n;i++){const r=R*pct[i]/100;const[x,y]=pt(i,r);ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.fillStyle='#D9B45B';ctx.fill();}ctx.fillStyle='#6E6E73';ctx.font='600 20px PingFang SC, Microsoft YaHei';ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<n;i++){const d=DIMS[i];const[x,y]=pt(i,R+30);ctx.fillText(d.zh,x,y);}}
function showShareCard(){document.getElementById('shareCard').classList.add('show');}
function hideShareCard(){document.getElementById('shareCard').classList.remove('show');}
function copyShare(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(shareText).then(()=>alert('已复制 · Copied'));}else{const ta=document.createElement('textarea');ta.value=shareText;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('已复制 · Copied');}}
function restart(){start();}
(function(){
  document.getElementById('i-eyebrow').textContent='成都康礼学校 · Cogdel School Chengdu';
  document.getElementById('i-title').innerHTML='测测你的<br>八维火花<span class="en">Discover Your<br>8-Dimension Spark</span>';

  const mr=document.getElementById('mascotRow');const ALL=[PERSONAS.agency,PERSONAS.learning,PERSONAS.innovation,PERSONAS.collaboration,PERSONAS.leadership,PERSONAS.wellbeing,PERSONAS.vision,PERSONAS.stewardship,BALANCED];ALL.forEach(p=>{const d=document.createElement('div');d.className='m float';d.innerHTML=charHTML(p);mr.appendChild(d);});
})();
