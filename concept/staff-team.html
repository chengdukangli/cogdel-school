<meta charset="UTF-8">

<title>成都康礼学校 师资团队 | Cogdel School Chengdu Faculty</title>
<style>
  :root{--purple:#5A3580;--purple-dark:#43265f;--purple-deep:#2e1a44;--gold:#c9a84c;--gold-light:#e6cf8f;--gold-deep:#a8892f;--bg:#f7f4ef;--card:#fff;--ink:#2b2333;--line:rgba(90,53,128,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1440px;margin:0 auto;padding:0 28px 80px;}
  header.hero{background:linear-gradient(135deg,var(--purple-deep),var(--purple) 52%,var(--purple-dark));color:#fff;padding:50px 26px 42px;text-align:center;position:relative;overflow:hidden;margin-bottom:34px;}
  header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 84% 16%,rgba(201,168,76,.45),transparent 42%),radial-gradient(circle at 10% 88%,rgba(230,207,143,.25),transparent 42%);}
  .hero-inner{position:relative;z-index:2;max-width:900px;margin:0 auto;}
  .hero .crest{width:50px;height:50px;margin:0 auto 12px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--purple-deep);font-weight:800;font-size:23px;line-height:50px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .hero h1{font-size:clamp(25px,3.6vw,36px);font-weight:800;letter-spacing:1.5px;}
  .hero .en{font-family:Georgia,serif;font-style:italic;color:var(--gold-light);font-size:15px;margin-top:8px;}
  .toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px;}
  .toc a{text-decoration:none;color:var(--purple);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;}
  .toc a:hover{background:var(--purple);color:#fff;}
  .sec{margin-bottom:34px;}
  .sec-head{display:flex;align-items:baseline;gap:14px;padding:0 2px 14px;border-bottom:2px solid var(--gold);margin-bottom:20px;}
  .sec-head h2{font-size:26px;color:var(--purple);font-weight:800;letter-spacing:1px;}
  .sec-head .en{font-family:Georgia,serif;font-style:italic;color:var(--gold-deep);font-size:15px;}
  .sec-head .cnt{margin-left:auto;color:#9b8fb0;font-size:14px;white-space:nowrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(90,53,128,.06);break-inside:avoid;}
  .card img{display:block;width:100%;height:auto;}
  @media print{
    @page{size:A4 portrait;margin:0;}
    body{background:#fff;}
    header.hero{display:none!important;}
    .toc{display:none!important;}
    .wrap{max-width:none;padding:0;}
    .sec{margin:0;page-break-before:always;page-break-after:avoid;}
    .sec-head h2{font-size:20px;}
    .sec-head .en{font-size:12px;}
    .grid{grid-template-columns:1fr 1fr;gap:0;}
    .card{border:none;border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid;}
    .card img{width:100%;height:auto;}
  }
</style>
</head>
