计", "audience": "P4P5P6", "capacity": "", "language": "", "time": "16:20–17:05", "day": "thursday", "cat": "艺术与设计"}, {"nameZh": "永续农业生态种植", "nameEn": "", "icon": "🔭", "grad": ["#427293", "#255576"], "descZh": "永续农业生态种植课以食农教育与永续发展目标为核心，通过从土地到餐桌的完整体验，让学生在实际操作中学习生态种植技术，理解农业与环境的密切关联。学生将在校园学田中，亲身体验土壤改良、堆肥制作、友善种植、生态防治、植物加工与料理等全过程，认识自然资源的循环利用，培养对土地的关怀与对生态的责任感，成为具备永续思维的小小绿色生活实践家。", "highlightsZh": ["了解永续农业的基本原则，认识土壤、水源、生物多样性与农业生产的相互关系", "掌握基本种植技能，包括育苗、栽培、浇水、施肥与采收", "理解堆肥原理与资源循环利用，学会将厨余、落叶转化为有机肥料", "认识生物多样性对农业的重要性，学会使用天然方法进行病虫害防治"], "teacherZh": "饶丹", "categoryZh": "科学与技术", "audience": "P3P4P5P6", "capacity": "", "language": "", "time": "16:20–17:05", "day": "tuesday", "cat": "科学与技术"}, {"nameZh": "深度阅读思辨", "nameEn": "", "icon": "📚", "grad": ["#c6a562", "#93722f"], "descZh": "五六年级是阅读能力从“量积累”迈向“质飞跃”的关键转折期。面对篇幅更长、意蕴更深、文体更多元的文本时，要能“读出深意、读出见解、读出审美”，对信息整合能力、逻辑思辨能力和个性化表达能力有更高要求。本课程以“阅读素养”为核心导向，系统整合经典整本书精读、主题群文比较阅读、实用非连续性文本研读三大板块，覆盖文学、历史、科普、新闻、图表等多种阅读场景。课程采用“读—思—议—写—创”五环教学模式，每节课都让学生经历“沉浸阅读—独立思考—小组碰撞—表达输出”的完整学习闭环，培养会提问、有主见、", "highlightsZh": ["熟练运用精读、略读、跳读、扫读等策略，根据不同文本类型灵活调整阅读方式 准确把握叙", "事类文本的人物、情节、环境三要素，分析人物形象与性格发展 清晰梳理说明文本的逻辑结", "构，理解作者说明事理的方法 结合时代背景与作者生平，初步理解经典作品的主题内涵与社", "会意义 将阅读收获转化为创意输出 周一"], "teacherZh": "饶丹", "categoryZh": "语言与文学", "audience": "P5P6", "capacity": "", "language": "", "time": "16:20–17:05", "day": "monday", "cat": "语言与文学"}, {"nameZh": "古韵启蒙", "nameEn": "", "icon": "📚", "grad": ["#bf9e5b", "#704f0c"], "descZh": "本课程选取适合小学生阅读的经典篇章与历史小古文，如《三字经》《千字文》节选、浅显的《史记》故事、成语典故、古代寓言等，通过诵读、讲解、演绎、创作相结合的方式，带领学生跨越时空，亲近古人智慧。课程不追求艰深训诂，而注重在故事中感受历史人物精神，在音韵中体味汉语之美，在思辨中理解传统文化价值观，为文言文学习埋下兴趣的种子。", "highlightsZh": ["流畅朗读经典古文段落，培养文言语感，积累常用文言词汇", "了解历史背景和人物事迹，理解忠孝、诚信、勤学等传统美德", "能够借助注释和工具，独立阅读浅显文言小故事", "尝试将古文故事改编为课本剧或现代白话版，进行创意演绎"], "teacherZh": "饶丹", "categoryZh": "语言与文学", "audience": "P4P5P6", "capacity": "", "language": "", "time": "16:20–17:05", "day": "wednesday", "cat": "语言与文学"}, {"nameZh": "辩论基础", "nameEn": "", "icon": "📚", "grad": ["#ad8c49", "#957431"], "descZh": "辩论基础课是一门培养批判性思维、逻辑 function render(){
