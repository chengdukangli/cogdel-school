<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定制课程 · 学生课表 | Cogdel School Chengdu</title>
<style>
  :root{--purple:#5A3580;--purple-dark:#43265f;--purple-deep:#2e1a44;--gold:#c9a84c;--gold-light:#e6cf8f;--gold-deep:#a8892f;--bg:#f7f4ef;--card:#fff;--ink:#2b2333;--line:rgba(90,53,128,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;}
  header.hero{background:linear-gradient(135deg,var(--purple-deep),var(--purple) 52%,var(--purple-dark));color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;}
  .hero h1{font-size:19px;font-weight:800;letter-spacing:1px;}
  .hero .en{font-family:Georgia,serif;font-style:italic;color:var(--gold-light);font-size:12px;margin-top:2px;}
  .hero a.back{color:var(--gold-light);text-decoration:none;font-size:13px;border:1px solid rgba(230,207,143,.5);padding:6px 14px;border-radius:999px;}
  .hero a.back:hover{background:var(--gold-light);color:var(--purple-deep);}
  .frame{flex:1 1 auto;position:relative;background:#f5f6f8;}
  .frame iframe{width:100%;height:100%;border:0;display:block;}
  @media print{ body{height:auto;} header.hero{display:none!important;} .frame{height:auto;} .frame iframe{height:auto;min-height:900px;} }
</style>
</head>
<body>
<header class="hero">
  <div>
    <h1>定制课程 · 学生课表</h1>
    <div class="en">Cogdel School Chengdu · Custom Timetable</div>
  </div>
  <a class="back" href="https://en.cogdelschool.com/concept/index.html">← 返回资料库</a>
</header>
<div class="frame"><iframe id="f" src="http://118.24.139.114:3081/login.html" title="学生课表系统登录"></iframe></div>
<script>
  const SRC='http://118.24.139.114:3081';
  document.getElementById('f').src=SRC+'/login.html';
</script>
</body>
</html>
